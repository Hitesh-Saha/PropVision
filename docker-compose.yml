services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db
    networks:
      - propvision-network

  pricing-api:
    build:
      context: ./pricing-api
      dockerfile: Dockerfile
    container_name: pricing-api
    ports:
      - "8080:8080"
    volumes:
      - ./pricing-api/House Price Dataset.csv:/app/House Price Dataset.csv:ro
    networks:
      - propvision-network

  propvision-backend:
    build:
      context: ./prop-vision-portal/backend
      dockerfile: Dockerfile
    container_name: propvision-backend
    ports:
      - "8000:8000"
    depends_on:
      - pricing-api
      - mongodb
    env_file:
      - ./prop-vision-portal/backend/.env
    networks:
      - propvision-network

  propvision-frontend:
    build:
      context: ./prop-vision-portal/frontend
      dockerfile: Dockerfile
    container_name: propvision-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./prop-vision-portal/frontend/.env
    depends_on:
      - propvision-backend
    networks:
      - propvision-network

networks:
  propvision-network:
    driver: bridge

volumes:
  mongo_data:
